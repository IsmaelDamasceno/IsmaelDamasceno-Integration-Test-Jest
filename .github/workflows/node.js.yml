name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'

jobs:
  build:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      GUILD_ID: ${{ secrets.GUILD_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify Discord configuration
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "ERROR: DISCORD_TOKEN is missing"
            exit 1
          fi

          if [ -z "$CLIENT_ID" ]; then
            echo "ERROR: CLIENT_ID is missing"
            exit 1
          fi

          if [ -z "$GUILD_ID" ]; then
            echo "ERROR: GUILD_ID is missing"
            exit 1
          fi

          echo "DISCORD_TOKEN is configured"
          echo "CLIENT_ID is configured"
          echo "GUILD_ID is configured"

      - name: Run integration tests
        run: npm test

  sonarcloud:
    name: Run SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
